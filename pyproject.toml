[project]
name = "cascada-control"
version = "0.1.0"
description = "Teleoperación con escala cartesiana para el KSR-01 (Proyecto Cascada)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
sim = ["mujoco>=3.1.6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascada_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
